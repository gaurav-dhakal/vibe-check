name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A push to the same branch or PR supersedes the run before it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt must be clean
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "not gofmt-clean:"; echo "$unformatted"; exit 1; }
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: race detector (the collectors are concurrent by design)
        if: matrix.os == 'ubuntu-latest'
        run: go test ./... -count=1 -race
      - run: go build ./...
      - run: go run . --version

      # The real question is whether it can read this operating system, so run
      # the headless path on every platform and check the numbers are plausible.
      - name: collect a snapshot on ${{ matrix.os }}
        shell: bash
        run: go run . --json > snapshot.json
      - name: snapshot must contain real telemetry
        shell: bash
        run: awk -f scripts/verify-snapshot.awk < snapshot.json

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: every shipped target must compile
        run: |
          set -euo pipefail
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null . && echo "ok  $t"
          done
