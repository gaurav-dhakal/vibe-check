name: Feature request
description: Propose something new — a metric, an engine, a keybinding, a platform.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        vibe-check only shows numbers it can prove. If your idea needs data the
        kernel does not expose, say so and we will discuss where it comes from.
  - type: textarea
    id: problem
    attributes:
      label: What is missing today?
      description: The friction you hit, not the solution.
      placeholder: I cannot see per-container memory without attaching to a terminal.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should happen instead?
      description: Behaviour, keybinding, flag or pane layout — as concrete as you can.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Which part does this touch?
      options:
        - Collectors (engine/*)
        - Rendering / UI
        - Keybindings / palette
        - Config
        - Packaging / installers
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      placeholder: Other tools that already do this, or a workaround inside vibe-check.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues for this request.
          required: true
        - label: I am willing to send a PR for it (optional, but it helps).
          required: false
